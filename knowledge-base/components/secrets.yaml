id: secrets
name: Secrets and credentials
description: API keys, database passwords, signing keys and service credentials the app depends on.
order: 70
question: Does the app use secrets such as API keys, database passwords or signing keys?
platforms: [web, backend, android, ios]

options:
  type: object
  additionalProperties: false
  properties:
    storage:
      title: Where are production secrets kept?
      enum: [env_vars, secrets_manager, config_files]
    ci_cd:
      title: Is the app built or deployed by a CI/CD pipeline?
      type: boolean
      default: true

threats:
  - id: SEC-T1
    title: Secrets committed to source control
    stride: [I]
    cwe: [CWE-798, CWE-540]

  - id: SEC-T2
    title: Secrets shipped inside web bundles or mobile apps
    description: Anything in client code can be extracted, including "hidden" environment variables bundled at build time.
    stride: [I]
    cwe: [CWE-798]

  - id: SEC-T3
    title: Long-lived secrets that are never rotated
    stride: [S, I]
    cwe: [CWE-324]

  - id: SEC-T4
    title: Secrets leaked through logs, error reports or CI output
    stride: [I]
    cwe: [CWE-532]

  - id: SEC-T5
    title: Over-privileged credentials magnify any leak
    stride: [E]
    cwe: [CWE-250]

  - id: SEC-T6
    title: Secrets in config files readable by too many people or processes
    stride: [I]
    cwe: [CWE-522]
    when:
      storage: [config_files]

  - id: SEC-T7
    title: CI/CD compromise exposes deployment credentials
    stride: [T, I, E]
    cwe: [CWE-829]
    when:
      ci_cd: [true]

controls:
  - id: SEC-C1
    title: Never commit secrets; scan for them before every commit and in CI
    mitigates: [SEC-T1]
    severity: critical
    level: 1
    standards:
      asvs: [V2.10.4]
      owasp_top10: [A07]
      cwe: [CWE-798, CWE-540]
    guidance: |
      Keep `.env*` files in `.gitignore`, commit only `.env.example` with placeholders, and run
      a secret scanner (e.g. gitleaks, trufflehog) as a pre-commit hook and in CI. A secret that
      was ever committed is compromised: rotate it, do not just delete it from history.
    ai_rule: >-
      Never write real secrets, API keys or passwords into code, config or example files; read
      them from environment variables or a secret store and use placeholders in .env.example.
    verify:
      - type: config
        description: A secret scanner runs in pre-commit and CI; .env is gitignored.

  - id: SEC-C2
    title: No private secrets in client code
    mitigates: [SEC-T2]
    severity: critical
    level: 1
    platforms: [web, android, ios]
    standards:
      asvs: [V2.10.4]
      masvs: [MASVS-STORAGE-1]
      owasp_top10: [A07]
      cwe: [CWE-798]
    guidance: |
      Frontends and mobile apps may only contain publishable keys (e.g. Stripe `pk_...`). Any
      call that needs a secret goes through your backend. Watch build-time env prefixes such as
      `NEXT_PUBLIC_`, `VITE_`, `EXPO_PUBLIC_` and `REACT_APP_` — they are embedded in the bundle.
    ai_rule: >-
      Never put secret keys in frontend or mobile code, including NEXT_PUBLIC_, VITE_,
      EXPO_PUBLIC_ or REACT_APP_ variables; calls that need a secret must go through the backend.
    verify:
      - type: semgrep
        description: No secret-looking literals or secret env vars referenced in client code.

  - id: SEC-C3
    title: Use a secrets manager in production
    mitigates: [SEC-T6, SEC-T3]
    severity: high
    level: 2
    platforms: [backend]
    standards:
      asvs: [V6.4.1]
      owasp_top10: [A05]
      cwe: [CWE-522]
    guidance: Keep production secrets in a managed store (AWS Secrets Manager, GCP Secret Manager, Azure Key Vault, Vault) with access control and audit logging.
    ai_rule: >-
      Load production secrets from the configured secrets manager or environment at runtime;
      never read them from files committed with the code.
    verify:
      - type: manual
        description: Production secrets live in a managed store with access logging.

  - id: SEC-C4
    title: Rotate secrets and prefer short-lived credentials
    mitigates: [SEC-T3]
    severity: medium
    level: 2
    platforms: [backend]
    standards:
      asvs: [V6.4.1]
      owasp_top10: [A07]
      cwe: [CWE-324]
    guidance: Make every secret rotatable without a code change; rotate on a schedule, when people leave and after any exposure; prefer workload identity / short-lived tokens over static keys.
    ai_rule: >-
      Design code so every secret can be rotated without a code change (read at startup or
      per use); prefer short-lived credentials or workload identity over static keys.
    verify:
      - type: manual
        description: There is a documented rotation procedure and it has been exercised.

  - id: SEC-C5
    title: Least-privilege credentials, separate per environment
    mitigates: [SEC-T5]
    severity: high
    level: 1
    platforms: [backend]
    standards:
      owasp_top10: [A01]
      cwe: [CWE-250, CWE-272]
    guidance: Scope each key to the minimum permissions for one service, and never share credentials between development, staging and production.
    ai_rule: >-
      Use separate, minimally scoped credentials per service and per environment; never reuse
      production credentials in development or tests.
    verify:
      - type: manual
        description: Production keys have restricted scopes and are not present in dev configs.

  - id: SEC-C6
    title: Redact secrets from logs, errors and CI output
    mitigates: [SEC-T4]
    severity: high
    level: 1
    standards:
      asvs: [V7.1.1]
      owasp_top10: [A09]
      cwe: [CWE-532]
    guidance: Never print environment variables or config objects; configure the logger and error reporter to redact secret fields; mask secrets in CI.
    ai_rule: >-
      Never log or print environment variables, config objects, headers like Authorization,
      or any secret value; redact them in logs and error reports.
    implement:
      node: redact()
    verify:
      - type: semgrep
        description: No logging of process.env, config objects or Authorization headers.

  - id: SEC-C7
    title: Harden the CI/CD pipeline
    mitigates: [SEC-T7, SEC-T3]
    severity: medium
    level: 2
    when:
      ci_cd: [true]
    standards:
      owasp_top10: [A08]
      cwe: [CWE-829]
    guidance: |
      Use OIDC federation instead of long-lived cloud keys, restrict deployment secrets to
      protected branches/environments, pin third-party CI actions to a commit SHA, and do not
      expose secrets to pull requests from forks.
    ai_rule: >-
      In CI workflows: pin third-party actions to a full commit SHA, use OIDC instead of stored
      cloud keys, and never expose secrets to fork pull requests.
    verify:
      - type: semgrep
        description: CI workflow actions are pinned by SHA.
